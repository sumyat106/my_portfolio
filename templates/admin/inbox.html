<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Inbox Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between mb-4">
            <h2 class="fw-bold">Visitor Inquiries Inbox</h2>
            <a href="/admin/dashboard" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="card p-4 border-0 shadow-sm">
            <table class="table">
                <thead>
                    <tr><th>Status</th><th>Sender</th><th>Email</th><th>Message</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    {% for msg in messages %}
                    <tr class="{{ 'table-warning fw-bold' if not msg['is_read'] else 'text-muted' }}">
                        <td>
                            <a href="/admin/inbox/toggle/{{ msg['id'] }}" class="btn btn-sm {{ 'btn-warning' if not msg['is_read'] else 'btn-outline-secondary' }}">
                                {{ 'Mark Read' if not msg['is_read'] else 'Mark Unread' }}
                            </a>
                        </td>
                        <td>{{ msg['name'] }}</td>
                        <td>{{ msg['email'] }}</td>
                        <td>{{ msg['message'] }}</td>
                        <td><a href="/admin/inbox/delete/{{ msg['id'] }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete message?')"><i class="fas fa-trash"></i></a></td>
                    </tr>
                    {% else %}
                    <tr><td colspan="5" class="text-center text-muted">Your inbox is empty.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
